<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Assignment 10: Multimedia: Image, Video, Audio ,Youtube </title>
</head>
<body>
    <h3> Images </h3>
    <p>College Campus</p>
    <img src="https://www.abes.ac.in/assets/2.jpg" alt="College Campus" width="400" height="400">
    <h3> Video </h3>
    <video width="400" height="200" controls>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <h3> Audio </h3>
    <audio controls>   
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio> 
    <h3> Youtube </h3>
    <iframe width="400" height="400" src="https://www.youtube.com/embed/V72yOMozZo4" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
</body>
</html>
