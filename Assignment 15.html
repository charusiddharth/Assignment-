<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 15:Form:Inputs Elements,Label and Fieldset</title>
</head>
<body>
    <form action="submit.php" method="post">
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name:</label>
            <input type="text" id="name"  placeholder="Enter Your Name " required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your Email" required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter your Password" required><br><br>

            <label for="age">Age:</label>
            <input type="number" id="age" placeholder="Enter your Age" required><br><br>

            <label for="gender">Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>

            <label for="Hobbies">Hobbies:</label>
            <label for="reading">Reading</label>
            <input type="checkbox" id="reading" name="hobbies" value="reading">
             <label for="Coding">Coding</label>
            <input type="checkbox" id="Coding" name="hobbies" value="coding">
            <br><br>

            <label for="DOB">DOB:</label>
            <input type="date" id="DOB" placeholder="Enter your Date of Birth" required><br><br>

        </fieldset>
    </form>
</body>
</html>
